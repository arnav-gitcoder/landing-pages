<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Piano</title>
    <link rel="stylesheet" href="piano.css">
</head>

<body>

    <h1>🎹 Virtual Piano</h1>

    <div class="piano">

        <!-- White Keys -->
        <div class="key white" data-key="a" data-note="C4">A</div>
        <div class="key white" data-key="s" data-note="D4">S</div>
        <div class="key white" data-key="d" data-note="E4">D</div>
        <div class="key white" data-key="f" data-note="F4">F</div>
        <div class="key white" data-key="g" data-note="G4">G</div>
        <div class="key white" data-key="h" data-note="A4">H</div>
        <div class="key white" data-key="j" data-note="B4">J</div>
        <div class="key white" data-key="k" data-note="C5">K</div>

        <!-- Black Keys -->
        <div class="key black" data-key="w" data-note="C#4">W</div>
        <div class="key black" data-key="e" data-note="D#4">E</div>
        <div class="key black" data-key="t" data-note="F#4">T</div>
        <div class="key black" data-key="y" data-note="G#4">Y</div>
        <div class="key black" data-key="u" data-note="A#4">U</div>

    </div>

    <script src="piano.js"></script>

</body>
</html>
